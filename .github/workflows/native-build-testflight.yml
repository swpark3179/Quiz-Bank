name: App Build & Release — Android APK · iOS TestFlight (Main)

# Expo Cloud(EAS Build/Submit)를 전혀 사용하지 않고 GitHub Actions runner 에서
# 직접 native build 를 수행한다.
#   - Android : Gradle 로 release APK(직접 설치용) + AAB(Google Play 업로드용) 빌드
#               두 산출물 모두 ANDROID_KEYSTORE_* 의 release keystore 로 서명하고 검증한다.
#   - iOS     : xcodebuild 로 archive/export 하여 IPA 빌드
# Android / iOS 빌드가 모두 성공하면 새 GitHub Release 를 생성하고(APK + AAB + IPA 첨부),
# iOS 는 App Store Connect API(altool)로 TestFlight 에 업로드한다.
# Android 배포 절차: docs/android-deployment.md
#
# 주의: 워크플로 name 을 바꾸면 windows-desktop-release.yml 의 workflow_run 트리거도
#       함께 바꿔야 한다.
#
# 참고: `expo prebuild` 는 runner 에서 로컬로 실행되는 CLI 명령으로 native 프로젝트
#       (android/, ios/) 를 생성할 뿐이며 Expo Cloud(EAS) 와는 무관하다.
#       빌드 자체는 gradle / xcodebuild 로 직접 수행된다.
#
# ─────────────────────────────────────────────────────────────────────────────
# 필요한 GitHub Secrets
# ─────────────────────────────────────────────────────────────────────────────
#   [Android 서명]
#     ANDROID_KEYSTORE_BASE64         - release.keystore 를 base64 인코딩한 값
#     ANDROID_KEYSTORE_PASSWORD       - keystore 비밀번호
#     ANDROID_KEY_ALIAS               - key alias
#     ANDROID_KEY_PASSWORD            - key 비밀번호
#
#   [iOS 코드 서명]
#     IOS_P12_BASE64                  - distribution .p12 인증서를 base64 인코딩한 값
#     IOS_P12_PASSWORD                - p12 비밀번호
#     IOS_PROVISIONING_PROFILE_BASE64 - App Store 배포용 .mobileprovision base64
#     IOS_KEYCHAIN_PASSWORD           - 임시 keychain 용 비밀번호 (임의 값)
#     IOS_TEAM_ID                     - Apple Developer Team ID (10자리)
#     IOS_CODE_SIGN_IDENTITY          - 예: "Apple Distribution: Name (TEAMID)"
#     IOS_PROVISIONING_PROFILE_NAME   - provisioning profile 의 Name (UUID 아님)
#
#   [iOS TestFlight 업로드 - App Store Connect API Key]
#     ASC_KEY_ID                      - App Store Connect API Key ID
#     ASC_ISSUER_ID                   - App Store Connect API Issuer ID
#     ASC_PRIVATE_KEY                 - AuthKey_XXXX.p8 파일 내용 (전체 텍스트)

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch
      upload_testflight:
        description: 'Upload iOS build to TestFlight'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  bump-version:
    name: Bump Version and Tag
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      # master 브랜치 보호 룰셋(Changes must be made through a pull request)을
      # 우회하려면 룰셋 Bypass list 에 등록된 GitHub App 토큰으로 push 해야 한다.
      # 기본 GITHUB_TOKEN(github-actions[bot])은 bypass 대상이 아니므로 막힌다.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump Version
        id: bump
        run: |
          pnpm run bump:${{ github.event.inputs.version_bump }}
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

          git add package.json app.json
          git commit -m "chore: bump version to v$NEW_VERSION"
          git tag "v$NEW_VERSION"
          git push origin HEAD
          git push origin "v$NEW_VERSION"

  build-android:
    name: Build Android APK & AAB (local)
    needs: bump-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged code
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.bump-version.outputs.new_version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 기본값 'tools platform-tools' 의 tools 는 더 이상 받을 수 없는 옛 패키지라
          # 새 sdkmanager 에서 "Failed to find package 'tools'" 로 실패한다.
          # Gradle 빌드에는 필요 없으므로 platform-tools 만 설치한다.
          packages: platform-tools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Expo prebuild (android)
        run: pnpm exec expo prebuild --platform android --no-install --clean

      # Play Console 의 "DEX 코드 최적화" 경고(Optimization/Obfuscation/Shrinking 중
      # 25% 미만 카테고리) 대응으로 R8 을 켰다. 설정이 조용히 빠져서 최적화되지 않은 AAB 가
      # 다시 올라가지 않도록 Gradle 빌드 전에 확인한다.
      - name: Verify R8 minify settings
        run: |
          set -e
          grep -qx 'android.enableMinifyInReleaseBuilds=true' android/gradle.properties \
            || { echo "::error::android.enableMinifyInReleaseBuilds=true missing in android/gradle.properties"; exit 1; }
          grep -qx 'android.enableShrinkResourcesInReleaseBuilds=true' android/gradle.properties \
            || { echo "::error::android.enableShrinkResourcesInReleaseBuilds=true missing in android/gradle.properties"; exit 1; }
          grep -q 'proguard-android-optimize.txt' android/app/build.gradle \
            || { echo "::error::release build does not use proguard-android-optimize.txt (withAndroidR8Optimize plugin not applied)"; exit 1; }
          grep -n "minifyEnabled\|shrinkResources\|proguardFiles" android/app/build.gradle

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Configure gradle signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # expo prebuild 가 만든 gradle.properties 는 마지막 줄에 개행이 없을 수 있다.
          # (expo-build-properties 가 enableMinify/ShrinkResources 를 끝에 추가하면서 그렇게 됨)
          # 그대로 이어 붙이면 첫 줄이 앞 줄에 합쳐져
          #   android.enableShrinkResourcesInReleaseBuilds=trueMYAPP_RELEASE_STORE_FILE=release.keystore
          # 가 되고, MYAPP_RELEASE_STORE_FILE 이 정의되지 않아 packageRelease 가
          # 'SigningConfig "release" is missing required property "storeFile"' 로 실패한다.
          # 그래서 파일이 개행으로 끝나지 않으면 먼저 개행을 넣는다.
          PROPS=android/gradle.properties
          if [ -s "$PROPS" ] && [ -n "$(tail -c1 "$PROPS")" ]; then
            echo >> "$PROPS"
          fi
          cat >> "$PROPS" <<EOF
          MYAPP_RELEASE_STORE_FILE=release.keystore
          MYAPP_RELEASE_KEY_ALIAS=${ANDROID_KEY_ALIAS}
          MYAPP_RELEASE_STORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}
          MYAPP_RELEASE_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}
          EOF

          # 이어 붙인 결과가 줄 단위로 온전한지 Gradle 빌드(약 20분) 전에 확인한다.
          for line in 'MYAPP_RELEASE_STORE_FILE=release.keystore' \
                      'android.enableMinifyInReleaseBuilds=true' \
                      'android.enableShrinkResourcesInReleaseBuilds=true'; do
            grep -qxF "$line" "$PROPS" \
              || { echo "::error::'$line' is not a standalone line in $PROPS"; exit 1; }
          done

          # build.gradle 에 release signingConfig 가 없으면 주입
          BUILD_GRADLE=android/app/build.gradle
          if ! grep -q "MYAPP_RELEASE_STORE_FILE" "$BUILD_GRADLE"; then
            node <<'NODE'
          const fs = require('fs');
          const path = 'android/app/build.gradle';
          let g = fs.readFileSync(path, 'utf8');

          const signingBlock = `
              release {
                  if (project.hasProperty('MYAPP_RELEASE_STORE_FILE')) {
                      storeFile file(MYAPP_RELEASE_STORE_FILE)
                      storePassword MYAPP_RELEASE_STORE_PASSWORD
                      keyAlias MYAPP_RELEASE_KEY_ALIAS
                      keyPassword MYAPP_RELEASE_KEY_PASSWORD
                  }
              }
          `;

          // Find the signingConfigs block and locate its matching closing brace
          // via brace counting (regex can't handle nested braces like debug { ... }).
          function findMatchingClose(src, openIdx) {
              let depth = 1;
              for (let i = openIdx + 1; i < src.length; i++) {
                  if (src[i] === '{') depth++;
                  else if (src[i] === '}') {
                      depth--;
                      if (depth === 0) return i;
                  }
              }
              return -1;
          }

          const sigMatch = g.match(/signingConfigs\s*\{/);
          if (sigMatch) {
              const openIdx = sigMatch.index + sigMatch[0].length - 1;
              const closeIdx = findMatchingClose(g, openIdx);
              if (closeIdx !== -1) {
                  // Insert release as a sibling, immediately before the signingConfigs closing brace.
                  g = g.slice(0, closeIdx) + signingBlock + g.slice(closeIdx);
              }
          }

          // buildTypes.release 의 서명 설정을 signingConfigs.release 로 맞춘다.
          // Expo 템플릿의 release 에는 처음부터 'signingConfig signingConfigs.debug' 가
          // 들어 있으므로, 있으면 교체하고 없으면 추가한다. (v1.5.1 까지는 이 줄이 있으면
          // 그대로 두는 바람에 APK 가 공개된 debug.keystore 로 서명되었다.)
          const SIGNING_LINE = /signingConfig\s+signingConfigs\.\w+/;
          const RELEASE_BUILD_TYPE = /(buildTypes\s*\{[\s\S]*?release\s*\{)([\s\S]*?)(\})/;
          g = g.replace(RELEASE_BUILD_TYPE, (m, head, inner, tail) => {
              const next = SIGNING_LINE.test(inner)
                  ? inner.replace(SIGNING_LINE, 'signingConfig signingConfigs.release')
                  : `${inner}    signingConfig signingConfigs.release\n        `;
              return head + next + tail;
          });

          // 주입이 하나라도 빠지면 debug 키로 서명된 빌드가 조용히 만들어지므로,
          // Gradle 빌드(약 20분)를 돌리기 전에 여기서 바로 실패시킨다.
          const releaseType = g.match(RELEASE_BUILD_TYPE);
          if (!g.includes('MYAPP_RELEASE_STORE_FILE')) {
              console.error('::error::Failed to inject signingConfigs.release into android/app/build.gradle');
              process.exit(1);
          }
          if (!releaseType || !/signingConfig\s+signingConfigs\.release\b/.test(releaseType[2])) {
              console.error('::error::Failed to set "signingConfig signingConfigs.release" in buildTypes.release');
              process.exit(1);
          }
          fs.writeFileSync(path, g);
          NODE
          fi

          echo "signingConfig lines in $BUILD_GRADLE:"
          grep -n "signingConfig " "$BUILD_GRADLE"

      # 한 번의 Gradle 실행으로 APK(GitHub Release 직접 설치용)와
      # AAB(Google Play 업로드용)를 함께 만든다. 컴파일 결과를 공유하므로
      # bundleRelease 를 추가해도 빌드 시간이 크게 늘지 않는다.
      - name: Build release APK & AAB
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Locate APK & AAB
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::No APK produced"
            exit 1
          fi
          cp "$APK" app-release.apk

          AAB=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n1)
          if [ -z "$AAB" ]; then
            echo "::error::No AAB produced"
            exit 1
          fi
          cp "$AAB" app-release.aab

          # R8 이 실제로 돌았다면 mapping.txt 가 생긴다. (AAB 에는 매핑이 자동으로 포함되어
          # Play Console 이 역난독화에 사용하므로 별도 업로드는 필요 없다.)
          MAPPING=android/app/build/outputs/mapping/release/mapping.txt
          if [ ! -s "$MAPPING" ]; then
            echo "::error::R8 mapping file not found ($MAPPING) — minify did not run"
            exit 1
          fi
          cp "$MAPPING" mapping.txt

      # APK·AAB 가 debug.keystore 가 아니라 ANDROID_KEYSTORE_BASE64 의 release keystore 로
      # 서명되었는지 인증서 SHA-256 지문을 비교해 확인한다. 서명 주입이 다시 깨져도
      # 릴리스가 만들어지기 전에 여기서 멈춘다.
      #   - APK: minSdk 24 라 v2/v3 서명만 있으므로 apksigner 로 확인
      #   - AAB: jar(v1) 서명이므로 keytool -printcert -jarfile 로 확인
      - name: Verify release signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          normalize() { tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]'; }

          EXPECTED=$(keytool -list -v -keystore android/app/release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" \
            | awk '$1 == "SHA256:" {print $2; exit}' | normalize)

          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          APK_CERTS=$("$APKSIGNER" verify --print-certs app-release.apk)
          # apksigner 버전에 따라 출력 형식이 다르다.
          #   옛 형식: "Signer #1 certificate SHA-256 digest: <hex>"
          #   새 형식: "V2 Signer: certificate SHA-256 digest: <hex>"  (서명 scheme 마다 한 줄)
          # ': ' 로 필드를 나누면 새 형식에서는 라벨("certificate SHA-256 digest")이 잡히므로
          # "digest:" 뒤의 값만 꺼낸다. 모든 signer 줄의 지문이 하나로 같아야 한다.
          APK_SHA256_ALL=$(echo "$APK_CERTS" \
            | sed -n 's/.*certificate SHA-256 digest:[[:space:]]*//p' \
            | tr -d ':[:blank:]\r' | tr '[:upper:]' '[:lower:]' | sort -u)
          APK_SHA256=$(echo "$APK_SHA256_ALL" | head -n1)
          APK_SIGNER_COUNT=$(echo "$APK_SHA256_ALL" | grep -c . || true)

          # 서명 무결성만 확인한다. (-strict 는 self-signed 인증서를 오류로 보므로 쓰지 않는다)
          if ! jarsigner -verify app-release.aab > /dev/null; then
            echo "::error::AAB signature verification failed (jarsigner -verify)"
            exit 1
          fi
          AAB_CERTS=$(keytool -printcert -jarfile app-release.aab)
          AAB_SHA256=$(echo "$AAB_CERTS" | awk '$1 == "SHA256:" {print $2; exit}' | normalize)

          echo "$APK_CERTS" | grep "certificate DN" || true
          echo "release keystore SHA-256 : $EXPECTED"
          echo "APK signer SHA-256       : $APK_SHA256"
          echo "AAB signer SHA-256       : $AAB_SHA256"

          if [ -z "$EXPECTED" ]; then
            echo "::error::Could not read the certificate from release.keystore (check ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS)"
            exit 1
          fi
          if [ -z "$APK_SHA256" ]; then
            echo "$APK_CERTS"
            echo "::error::Could not read the APK signer SHA-256 from apksigner output"
            exit 1
          fi
          if [ "$APK_SIGNER_COUNT" -ne 1 ]; then
            echo "$APK_SHA256_ALL"
            echo "::error::APK has $APK_SIGNER_COUNT different signer certificates (expected exactly 1)"
            exit 1
          fi
          if echo "$APK_CERTS$AAB_CERTS" | grep -q "CN=Android Debug"; then
            echo "::error::Build is signed with the public debug keystore"
            exit 1
          fi
          if [ "$APK_SHA256" != "$EXPECTED" ] || [ "$AAB_SHA256" != "$EXPECTED" ]; then
            echo "::error::APK/AAB signing certificate does not match the release keystore"
            exit 1
          fi
          echo "APK and AAB are signed with the release keystore."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app-release.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app-release.aab

      # 난독화된 크래시 스택을 직접 풀어볼 때 쓰는 R8 매핑 파일.
      # 공개 Release 자산에는 올리지 않고 Actions artifact 로만 보관한다.
      - name: Upload R8 mapping artifact
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: mapping.txt

  build-ios:
    name: Build iOS IPA (local)
    needs: bump-version
    # Apple requires apps uploaded to App Store Connect (incl. TestFlight) to be
    # built with the iOS 26 SDK / Xcode 26+. Only macos-26 runners ship Xcode 26.
    runs-on: macos-26
    steps:
      - name: Checkout tagged code
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.bump-version.outputs.new_version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Select Xcode
        run: |
          # App Store Connect requires builds produced with the iOS 26 SDK (Xcode 26+).
          # Prefer Xcode 26 if present; fall back to the highest available Xcode otherwise.
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n1)
          fi
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=/Applications/Xcode.app
          fi
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version
          # Sanity check: surface the active SDK so failures are obvious in logs.
          xcrun --sdk iphoneos --show-sdk-version || true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Expo prebuild (ios)
        run: pnpm exec expo prebuild --platform ios --no-install --clean

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Setup signing keychain
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          for v in IOS_P12_BASE64 IOS_P12_PASSWORD IOS_KEYCHAIN_PASSWORD IOS_PROVISIONING_PROFILE_BASE64; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret $v"; exit 1; fi
          done

          KEYCHAIN=build.keychain
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" $KEYCHAIN
          security default-keychain -s $KEYCHAIN
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" $KEYCHAIN
          security set-keychain-settings -lut 21600 $KEYCHAIN

          echo "$IOS_P12_BASE64" | base64 -d > cert.p12

          # Diagnostic only: verify p12 integrity/password.
          # OpenSSL 3 rejects legacy algorithms (RC2-40 / 3DES-CBC) by default,
          # so pass -legacy. This is purely informational — the actual import
          # below uses Apple's Security framework which handles legacy p12 fine.
          echo "p12 file size: $(wc -c < cert.p12) bytes"
          echo "p12 password length: ${#IOS_P12_PASSWORD}"
          if openssl pkcs12 -legacy -in cert.p12 -nokeys -passin "pass:$IOS_P12_PASSWORD" -info -noout 2>&1; then
            echo "p12 verification OK"
          else
            echo "::warning::openssl could not parse the p12 even with -legacy; relying on 'security import' which may still succeed."
          fi

          # Import directly with Apple's Security framework — no openssl re-encryption.
          security import cert.p12 -k "$KEYCHAIN" \
            -P "$IOS_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$IOS_KEYCHAIN_PASSWORD" $KEYCHAIN

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > "$PROFILE_DIR/profile.mobileprovision"

      - name: Build & archive
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_CODE_SIGN_IDENTITY: ${{ secrets.IOS_CODE_SIGN_IDENTITY }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        working-directory: ios
        run: |
          # NOTE: `ls *.xcworkspace` (without -d) lists the *contents* of the
          # .xcworkspace bundle (e.g. contents.xcworkspacedata) rather than the
          # bundle itself, which then breaks the xcodebuild invocation below.
          WORKSPACE=$(ls -d *.xcworkspace | head -n1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)

          # build number(CFBundleVersion)는 app.json 의 expo.ios.buildNumber 로 관리하며
          # bump-version 잡에서 릴리스마다 1씩 증가시킨다. expo prebuild 가 이 값을
          # Info.plist 에 그대로 기록하므로 여기서 별도로 주입하지 않는다.
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/App.xcarchive" \
            archive \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$IOS_CODE_SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROVISIONING_PROFILE_NAME"

      - name: Export IPA (app-store)
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        working-directory: ios
        run: |
          # TestFlight 업로드를 위해 app-store export method 사용
          BUNDLE_ID=$(node -p "require('../app.json').expo.ios.bundleIdentifier")

          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${IOS_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadBitcode</key><false/>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${IOS_PROVISIONING_PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/App.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$PWD/build/ipa"

          IPA=$(find "$PWD/build/ipa" -name "*.ipa" | head -n1)
          cp "$IPA" "$GITHUB_WORKSPACE/app-release.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ipa
          path: app-release.ipa

  submit-testflight:
    name: Upload iOS to TestFlight (altool)
    needs: build-ios
    if: ${{ github.event.inputs.upload_testflight == 'true' }}
    # Use the same Xcode 26 runner so altool ships with the matching toolchain.
    runs-on: macos-26
    steps:
      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release-ipa

      - name: Verify TestFlight secrets
        run: |
          MISSING=""
          [ -z "${{ secrets.ASC_KEY_ID }}" ]     && MISSING="$MISSING ASC_KEY_ID"
          [ -z "${{ secrets.ASC_ISSUER_ID }}" ]  && MISSING="$MISSING ASC_ISSUER_ID"
          [ -z "${{ secrets.ASC_PRIVATE_KEY }}" ] && MISSING="$MISSING ASC_PRIVATE_KEY"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secrets for TestFlight upload:$MISSING"
            exit 1
          fi

      - name: Setup App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          # altool 은 ~/private_keys 등 정해진 경로에서 AuthKey_<KEY_ID>.p8 를 찾는다.
          #
          # 주의:
          #   1) `echo "$ASC_PRIVATE_KEY"` 는 백슬래시/옵션-유사 토큰 처리 때문에
          #      PEM 본문(특히 `-----BEGIN PRIVATE KEY-----` 줄)을 깨뜨릴 수 있다.
          #      => `printf '%s\n'` 으로 안전하게 기록한다.
          #   2) Secret 에 PEM 원문이 아니라 base64 로 인코딩된 .p8 가 저장된 경우도
          #      흔하므로 첫 줄에 BEGIN 마커가 없으면 base64 로 디코딩해서 다시 쓴다.
          #   3) PEM 본문에 CRLF 가 섞이면 altool 이 키 파싱에 실패하므로 CRLF 제거.
          mkdir -p ~/private_keys
          KEY_PATH="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY_PATH"

          # Strip potential CRLF that GitHub Secrets UI may introduce.
          tr -d '\r' < "$KEY_PATH" > "$KEY_PATH.tmp" && mv "$KEY_PATH.tmp" "$KEY_PATH"

          # If the file does not look like a PEM, assume base64-encoded .p8 and decode.
          if ! head -n1 "$KEY_PATH" | grep -q "BEGIN PRIVATE KEY"; then
            echo "AuthKey does not start with PEM header; attempting base64 decode."
            # Remove whitespace/newlines before decoding to tolerate wrapped or
            # single-line base64 inputs.
            tr -d ' \t\r\n' < "$KEY_PATH" | base64 -d > "$KEY_PATH.decoded" 2>/dev/null || {
              echo "::error::ASC_PRIVATE_KEY is neither a PEM nor valid base64."
              exit 1
            }
            mv "$KEY_PATH.decoded" "$KEY_PATH"
          fi

          chmod 600 "$KEY_PATH"

          # Sanity check — fail fast with a clear message rather than letting
          # altool produce its cryptic "Failed to load AuthKey file" error.
          if ! head -n1 "$KEY_PATH" | grep -q "BEGIN PRIVATE KEY"; then
            echo "::error::AuthKey file is not a valid PEM private key. Re-export the .p8 from App Store Connect and store its raw contents (or base64) in the ASC_PRIVATE_KEY secret."
            exit 1
          fi
          echo "AuthKey written to $KEY_PATH ($(wc -c < "$KEY_PATH") bytes)"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # 업로드 전 IPA 검증 후 App Store Connect(TestFlight)로 업로드
          xcrun altool --validate-app \
            -f app-release.ipa \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

          xcrun altool --upload-app \
            -f app-release.ipa \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

  create-release:
    name: Create GitHub Release
    needs: [bump-version, build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.bump-version.outputs.new_version }}

      - name: Download Android APK artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk

      - name: Download Android AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release-aab

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release-ipa

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 설치 안내 본문을 작성한 뒤 --notes-file 로 전달한다.
          # --generate-notes 를 함께 쓰면 gh 가 이 본문 뒤에 자동 변경 이력을 덧붙인다.
          # v1.5.1 이하는 debug 키로 서명되어 있어 release 서명 빌드로 덮어쓰기 설치가 안 되므로
          # 재설치 안내를 넣는다. 기존 사용자가 충분히 옮겨 간 뒤에는 이 안내를 빼도 된다.
          cat > release-notes.md <<'EOF'
          ## 📲 설치 방법

          ### Android
          아래 **Assets** 의 `app-release.apk` 파일을 안드로이드 기기에서 직접 다운로드한 뒤 실행하여 설치하세요.
          (출처를 알 수 없는 앱 설치 허용이 필요할 수 있습니다.)

          > ⚠️ **v1.5.1 이하 버전에서 업데이트하는 경우** — 앱 서명 키가 바뀌어 덮어쓰기 설치가 되지 않습니다.
          > 기존 앱을 삭제한 뒤 새로 설치하세요. 기기에 저장된 풀이 기록·통계도 함께 삭제됩니다.

          `app-release.aab` 는 Google Play 업로드용 파일입니다. 기기에 직접 설치할 수 없으니 `app-release.apk` 를 받으세요.

          ### iOS
          App Store 에서 **"문제은행 sds"** 로 검색한 뒤, 이 아이콘을 가진 앱을 설치하세요.
          (iOS 빌드는 TestFlight/App Store 를 통해 배포되며, IPA 파일을 직접 설치할 수는 없습니다.)

          ---
          EOF

          gh release create "v${{ needs.bump-version.outputs.new_version }}" \
            --title "Release v${{ needs.bump-version.outputs.new_version }}" \
            --notes-file release-notes.md \
            --generate-notes \
            app-release.apk \
            app-release.aab \
            app-release.ipa
